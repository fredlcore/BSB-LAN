name: Legacy LPB host regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check offline parser and recorded LPB evidence
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and run production-source regressions
        run: python3 -m unittest discover -s tests/host -v
